name: build-dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode.app
          git clone --depth=1 https://github.com/theos/theos.git /Users/runner/theos
          export THEOS=/Users/runner/theos
          cd $THEOS
          git submodule update --init --recursive
          # download SDKs
          $THEOS/bin/update-theos 2>&1 | tail -30
          ls $THEOS/vendor
      - name: Build
        env:
          THEOS: /Users/runner/theos
        run: |
          set -euo pipefail
          chmod +x Makefile
          make 2>&1 | tee build.log
          echo "=== artifacts ==="
          find . -name "*.dylib" -o -name "*.deb" 2>/dev/null
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: DLGMem-dylib
          path: |
            **/*.dylib
            **/*.deb
          if-no-files-found: error
