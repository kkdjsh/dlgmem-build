name: build-dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          git clone --depth=1 https://github.com/theos/theos.git /Users/runner/theos
          ls /Users/runner/theos
      - name: Build
        env:
          THEOS: /Users/runner/theos
        run: |
          chmod +x Makefile
          make 2>&1 | tee build.log
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: DLGMem-dylib
          path: |
            .theos/obj/debug/DLGMem.dylib
            .theos/obj/DLGMem.dylib
            **/*.dylib
